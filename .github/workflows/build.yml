name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - ferrum-development
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Apply Ferrum patches
        run: |
          set -e
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches to apply"
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "Applying $p"
            git apply --whitespace=nowarn "$p" || patch -p1 -f < "$p"
          done

      - name: Checkout submodules (retry on flaky remotes)
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if git submodule sync --recursive && git submodule update --init --recursive --jobs 4; then
              echo "Submodules are ready (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "All submodule attempts failed"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK, CMake, platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          grep -q "BUILD SUCCESSFUL" /tmp/build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -nE "error: |e: |FAILURE: What went wrong|Execution failed for task|Caused by:" /tmp/build.log 2>/dev/null | tail -10 > /tmp/errors.txt || true
          echo "=== extract ==="
          cat /tmp/errors.txt || true
          echo "=== tail ==="
          tail -25 /tmp/build.log || true
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            msg=$(echo "$line" | cut -c1-240)
            echo "::error title=Build error $i::$msg"
            [ $i -ge 10 ] && break
          done < /tmp/errors.txt

      - name: Save error log to ci-logs branch
        if: failure()
        run: |
          git config user.name "ferrum-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null || true
          if git rev-parse --verify origin/ci-logs >/dev/null 2>&1; then
            git checkout --force ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . 2>/dev/null || true
          fi
          grep -nE "error: |e: |FAILURE:|Execution failed for task|Caused by:|What went wrong" /tmp/build.log 2>/dev/null | tail -100 > errors-extract.txt || true
          { echo "=== errors-extract (head ${GITHUB_SHA::7}) ==="; cat errors-extract.txt; echo "=== last 150 lines of build.log ==="; tail -150 /tmp/build.log; } > build-errors.log
          git add -f build-errors.log
          git commit -m "build errors ${GITHUB_SHA::7}" || exit 0
          git push origin ci-logs

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
