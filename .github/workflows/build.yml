name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - ferrum-development
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK, CMake, platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
